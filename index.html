<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arisa | سیستم جامع</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    
    <style>
        :root {
            --kakao-yellow: #FEE500; --kakao-dark: #3C1E1E; --kakao-gray: #F5F5F5;
            --bg-main: #FFFFFF; --text-main: #191919; --text-muted: #8E8E8E; --border-color: #E5E5E5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; color: var(--text-main); }

        /* --- صفحه ورود --- */
        #loginPage { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; display: flex; flex-direction: column; justify-content: center; padding: 30px; }
        .login-logo { text-align: center; font-size: 36px; font-weight: 800; color: var(--kakao-dark); margin-bottom: 30px; letter-spacing: -1px; }
        .auth-input { width: 100%; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; outline: none; background: var(--kakao-gray); transition: 0.2s; }
        .auth-input:focus { border-color: var(--kakao-dark); background: #fff; }
        .auth-btn { width: 100%; padding: 15px; background: var(--kakao-yellow); color: var(--kakao-dark); border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .auth-btn:active { opacity: 0.8; transform: scale(0.98); }

        /* --- صفحه انتخاب (منو) --- */
        #menuPage { position: fixed; inset: 0; background: var(--bg-main); z-index: 9000; display: none; flex-direction: column; justify-content: center; padding: 30px; }
        .menu-title { text-align: center; font-size: 24px; font-weight: 800; color: var(--kakao-dark); margin-bottom: 40px; }
        
        .menu-cards { display: flex; flex-direction: column; gap: 20px; }
        .menu-card { background: var(--bg-main); border: 2px solid var(--border-color); border-radius: 24px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .menu-card:hover { border-color: var(--kakao-yellow); transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }
        
        /* آیکون‌های SVG */
        .menu-card .icon-box { width: 80px; height: 80px; border-radius: 24px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; position: relative; overflow: hidden; }
        
        /* استایل پایه برای آیکون ها */
        .menu-card .icon-box svg { width: 44px; height: 44px; overflow: visible; }
        
        .menu-card.live-card .icon-box { background: #e0f2fe; color: #0078d7; }
        .menu-card.chat-card .icon-box { background: #fef9c3; color: #ca8a04; }
        
        /* ========================================= */
        /* انیمیشن رسم شدن (Draw) برای آیکون لایو */
        /* ========================================= */
        .live-card .icon-box svg path { 
            fill: transparent; 
            stroke: currentColor; 
            stroke-width: 2; 
            stroke-linecap: round; 
            stroke-linejoin: round;
            stroke-dasharray: 100; 
            stroke-dashoffset: 100;
            animation: draw-camera 2s ease-in-out forwards;
        }

        @keyframes draw-camera {
            0% { stroke-dashoffset: 100; fill: transparent; }
            70% { stroke-dashoffset: 0; fill: transparent; }
            100% { stroke-dashoffset: 0; fill: currentColor; stroke: transparent; }
        }

        /* ========================================= */
        /* انیمیشن بوجود آمدن و تغییر شکل برای آیکون چت */
        /* ========================================= */
        .chat-card .icon-box svg path {
            fill: currentColor;
            transform-origin: center;
            animation: pop-chat 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop-chat {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* آیکون خروج */
        .menu-card h2 { font-size: 20px; margin-bottom: 8px; color: var(--text-main); font-weight: bold; }
        .menu-card p { font-size: 13px; color: var(--text-muted); }
        
        .logout-menu { text-align: center; margin-top: 40px; color: #ef4444; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .logout-menu svg { width: 20px; height: 20px; fill: currentColor; transition: 0.2s; }
        .logout-menu:hover svg { transform: translateX(-5px); }

        /* --- کانتینر برنامه‌ها --- */
        .app-container { flex: 1; position: relative; width: 100%; display: none; background: #f8fafc; }
        
        .back-to-menu { position: absolute; top: 15px; right: 15px; z-index: 9999; background: rgba(0,0,0,0.6); color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: bold; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(5px); transition: 0.2s; }
        .back-to-menu:hover { background: rgba(0,0,0,0.8); transform: scale(1.05); }
        .back-to-menu svg { width: 18px; height: 18px; fill: currentColor; }

        .app-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: none; }
        .app-frame.active { display: block; }
    </style>
</head>
<body>

    <!-- صفحه لاگین -->
    <div id="loginPage">
        <div class="login-logo">Arisa</div>
        <input type="text" id="loginUsername" class="auth-input" placeholder="نام کاربری (انگلیسی)">
        <input type="text" id="loginName" class="auth-input" placeholder="نام نمایشی">
        <input type="password" id="loginPassword" class="auth-input" placeholder="رمز عبور">
        <button class="auth-btn" onclick="doSharedLogin()">ورود به سیستم</button>
    </div>

    <!-- صفحه انتخاب برنامه -->
    <div id="menuPage">
        <div class="menu-title">به آریسا خوش آمدید</div>
        <div class="menu-cards">
            
            <!-- کارت لایو -->
            <div class="menu-card live-card" onclick="openApp('live')">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M17,10.5V7A1,1 0 0,0 16,6H4A1,1 0 0,0 3,7V17A1,1 0 0,0 4,18H16A1,1 0 0,0 17,17V13.5L21,17.5V6.5L17,10.5Z"/></svg>
                </div>
                <h2>کلاس مجازی (Live)</h2>
                <p>ورود به اتاق جلسه و ویدیو کنفرانس</p>
            </div>

            <!-- کارت پیام‌رسان -->
            <div class="menu-card chat-card" onclick="openApp('chat')">
                <div class="icon-box">
                    <svg viewBox="0 0 24 24"><path d="M20,2H4A2,2 0 0,0 2,4V22L6,18H20A2,2 0 0,0 22,16V4C22,2.89 21.1,2 20,2Z"/></svg>
                </div>
                <h2>پیام‌رسان (Chat)</h2>
                <p>گفتگو، گروه‌ها و کانال‌ها</p>
            </div>

        </div>
        <div class="logout-menu" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M16,17V14H9V10H16V7L21,12L16,17M14,2A2,2 0 0,1 16,4V6H14V4H5V20H14V18H16V20A2,2 0 0,1 14,22H5A2,2 0 0,1 3,20V4A2,2 0 0,1 5,2H14Z"/></svg>
            خروج از حساب
        </div>
    </div>

    <!-- کانتینر برنامه‌ها -->
    <div class="app-container" id="mainContainer">
        <button class="back-to-menu" id="backBtn" onclick="closeApp()">
            <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/></svg>
            منو
        </button>
        <iframe class="app-frame" id="frame-live" src="live.html"></iframe>
        <iframe class="app-frame" id="frame-chat" src="chat.html"></iframe>
    </div>

    <script>
        window.onload = function() {
            const savedUser = localStorage.getItem('arisa_user');
            if (savedUser) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('menuPage').style.display = 'flex';
            }
        };

        function doSharedLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const name = document.getElementById('loginName').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!username || !name || !password) return alert('لطفاً همه فیلدها را پر کنید');
            localStorage.setItem('arisa_user', JSON.stringify({ username, name, password }));
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('menuPage').style.display = 'flex';
        }

        function openApp(appName) {
            document.getElementById('menuPage').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'flex';
            document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('active'));
            if (appName === 'live') document.getElementById('frame-live').classList.add('active');
            else document.getElementById('frame-chat').classList.add('active');
        }

        function closeApp() {
            document.getElementById('mainContainer').style.display = 'none';
            document.getElementById('menuPage').style.display = 'flex';
            document.getElementById('backBtn').style.display = 'none';
            document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('active'));
        }

        function logout() {
            if(confirm('آیا از حساب خود خارج می‌شوید؟')) {
                localStorage.removeItem('arisa_user');
                location.reload();
            }
        }
    </script>
</body>
</html>
